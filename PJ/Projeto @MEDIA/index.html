<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./imgs/icon_box.png">
    <link rel="stylesheet" href="style.css">
    <title>Sendly</title>
</head>

<body>

    <img src="./imgs/icon_entregador.png" alt="">

    <h1>Sendly</h1> <!-- Atkinson Hyperlegible Mono - FONTE -->

    <form action="#" method="post">

        <main>
            <label for="email" class="labelsAcess">Login</label>
            <input type="email" name="email" required maxlength="50" autofocus>
            
            <label for="password" class="labelsAcess">Senha</label>
            <input type="password" name="password" required maxlength="50">
            <label for="a_esqueciSenha"><a href="#">esqueci a senha</a></label>

            <input type="submit" value="ENTRAR">
            <label for="a_criarUmaConta">Sua primeira vez aqui? <a href="#">Criar uma conta</a></label>
        </main>
        
    </form>
</body>

</html>
