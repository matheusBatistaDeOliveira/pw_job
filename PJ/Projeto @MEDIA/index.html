<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./imgs/icon_box.png">
    <link rel="stylesheet" href="css/style.css">
    <title>Sendly</title>
</head>

<body>

    <img src="./imgs/icon_entregador.png" alt="">

    <div id="linha"></div>

    <form action="#" method="post">

        <h1>Sendly</h1>

        <label for="email" class="labelsAcess">Login</label>
        <input type="email" name="email" required maxlength="50" placeholder="Email ou Telefone" autofocus>
            
        <label for="password" class="labelsAcess">Senha</label>
        <input type="password" name="password" required maxlength="50" placeholder="Password">
        <label for="a_esqueciSenha"><a href="#" id="esqueciSenhaA">esqueci a senha</a></label>

        <input type="submit" value="ENTRAR">
        <label for="a_criarUmaConta">Sua primeira vez aqui? <a href="#">Criar uma conta</a></label>        
    </form>

</body>

</html>
